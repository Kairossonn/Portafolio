<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio en Construcción</title>
    <style>
        /* Base del diseño */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1e2f, #0f0f1a);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        /* Animación 1: Engranaje giratorio */
        .icon-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
        }

        .gear {
            font-size: 80px;
            position: absolute;
            top: 0;
            left: 10px;
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(30deg); }
        }

        /* Animación 2: Texto con pulso */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
        }

        p {
            font-size: 1.1rem;
            color: #a0a0b8;
            margin-bottom: 30px;
        }

        /* Animación 3: Barra de carga infinita */
        .progress-bar {
            width: 250px;
            height: 6px;
            background: #2a2a40;
            border-radius: 3px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .progress-line {
            position: absolute;
            width: 40%;
            height: 100%;
            background: #00ffff;
            border-radius: 3px;
            animation: loading 1.5s infinite ease-in-out;
        }

        @keyframes loading {
            0% { left: -40%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-container">
            <!-- Usamos un emoji de engranaje como ejemplo rápido -->
            <div class="gear">⚙️</div>
        </div>
        <h1>En Construcción</h1>
        <p>Estamos preparando algo increíble para ti.</p>
        <div class="progress-bar">
            <div class="progress-line"></div>
        </div>
        <br/>
        <nav>
            <a href="./01-landing-page/index.html">↗️ Ir a Home </a>
        </nav>
    </div>

</body>
</html>
